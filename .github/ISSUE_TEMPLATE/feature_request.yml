name: 🚀 Feature request
description: An idea for a new capability, a new provider, or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: The situation you're in today and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like tamash-selenium to do. API sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework this is about (if specific)
      options:
        - Any / not framework-specific
        - JUnit 5
        - TestNG
        - Cucumber
        - Plain SelfHealingDriver.wrap
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
